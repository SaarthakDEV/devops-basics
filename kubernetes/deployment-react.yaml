apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-deployment
  labels:
    app: deployment-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: node-container
        image: philippaul/node-demo-app:01
        ports:
        - containerPort: 3000