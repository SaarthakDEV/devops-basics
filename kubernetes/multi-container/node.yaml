apiVersion: apps/v1
kind: Deployment
metadata:
    name: node-deployment
spec:
    replicas: 1
    selector:
        matchLabels:
            app: node-app
    template:
        metadata:
            labels:
                app: node-app
        spec:
            containers:
            - name: node-container
              image: philippaul/node-mongo-db:04
              env:
                - name: MONGO_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: mongo-config
                      key: MONGO_HOST
                - name: MONGO_PORT
                  valueFrom:
                    configMapKeyRef:
                      name: mongo-config
                      key: MONGO_PORT
    
---

apiVersion: v1
kind: Service
metadata:
    name: node-service
spec:
    selector:
        app: node-app
    ports:
        - name: http
          port: 8080
          targetPort: 3000